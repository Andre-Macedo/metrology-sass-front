name: Deploy Frontend to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH Key for VPS
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: SSH into VPS and Rebuild Frontend
        run: |
          ssh-keyscan -H "${{ secrets.VPS_SSH_HOST }}" >> ~/.ssh/known_hosts

          ssh ${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SSH_HOST }} "
            set -e
            echo '==> 1. Atualizando /var/www/metrology-sass-front (main)...'
            git -c core.fileMode=false -C /var/www/metrology-sass-front pull origin main

            echo '==> 2. Reconstruindo e reiniciando container amemiya-frontend...'
            cd /var/www/amemiya
            docker-compose -f docker-compose.prod.yml build frontend
            docker-compose -f docker-compose.prod.yml up -d --no-deps frontend
            docker restart nginx-proxy

            echo '==> DEPLOY FRONTEND CONCLUÍDO!'
          "
