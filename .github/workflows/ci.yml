name: Frontend CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Quality Checks (TypeScript & Unit Tests)
        run: npm run quality

      - name: Test build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8000/api"
          NEXT_PUBLIC_REVERB_HOST: "localhost"
          NEXT_PUBLIC_REVERB_KEY: "app-key"
          NEXT_PUBLIC_REVERB_PORT: "8080"
          NEXT_PUBLIC_REVERB_SCHEME: "http"
